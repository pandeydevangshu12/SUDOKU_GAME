<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranked Sudoku: Cumulative</title>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --paper: #f0ead6;
            --ink: #0f172a;
            --blue-ink: #1d4ed8;
            --highlight: rgba(167, 139, 250, 0.3);
            --error: #dc2626;
            --success: #15803d;
            --gold: #d97706;
        }

        body {
            background-color: #d1d5db;
            background-image: radial-gradient(#bebebe 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Indie Flower', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            user-select: none;
        }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
        }
        .modal-box {
            background: var(--paper); padding: 2rem; border-radius: 5px;
            text-align: center; max-width: 450px; width: 90%;
            clip-path: polygon(1% 1%, 99% 0%, 98% 99%, 0% 98%);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-height: 80vh; overflow-y: auto;
        }
        .hidden { display: none !important; }

        /* --- LEADERBOARD --- */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border-bottom: 2px solid var(--ink); padding: 8px; text-align: left; }
        th { font-size: 1.2rem; color: var(--blue-ink); }
        .rank-1 { color: var(--gold); font-weight: bold; }

        /* --- GAME UI --- */
        h1 { transform: rotate(-2deg); margin: 10px 0; color: var(--ink); }

        .top-bar {
            display: flex; justify-content: space-between; width: 100%;
            max-width: 500px; margin-bottom: 10px; font-weight: bold; font-size: 1.2rem;
            align-items: center;
        }

        .mode-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-btn {
            background: transparent; border: 2px solid var(--ink);
            padding: 5px 15px; cursor: pointer; font-weight: bold;
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
        }
        .mode-btn.active { background: var(--ink); color: var(--paper); }
        .btn-leaderboard { background: var(--gold); color: white; border: none; }

        .game-wrapper {
            background: var(--paper); padding: 20px;
            clip-path: polygon(1% 1%, 99% 0%, 98% 99%, 0% 98%);
            box-shadow: 5px 10px 15px rgba(0,0,0,0.3);
            position: relative;
        }

        #board { display: grid; border: 3px solid var(--ink); filter: url(#handdrawn); margin: 0 auto; }

        .cell {
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; cursor: pointer;
            border: 1px solid rgba(0,0,0,0.2);
            transition: background 0.2s;
        }

        /* GRIDS */
        .grid-9 { grid-template-columns: repeat(9, 45px); grid-template-rows: repeat(9, 45px); }
        .grid-9 .cell:nth-child(3n) { border-right: 3px solid var(--ink); }
        .grid-9 .cell:nth-child(9n) { border-right: none; }
        .grid-9 .cell:nth-child(n+19):nth-child(-n+27), .grid-9 .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 3px solid var(--ink); }

        .grid-6 { grid-template-columns: repeat(6, 55px); grid-template-rows: repeat(6, 55px); }
        .grid-6 .cell:nth-child(3n) { border-right: 3px solid var(--ink); }
        .grid-6 .cell:nth-child(6n) { border-right: none; }
        .grid-6 .cell:nth-child(n+13):nth-child(-n+18), .grid-6 .cell:nth-child(n+31):nth-child(-n+36) { border-bottom: 3px solid var(--ink); }

        .grid-3 { grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(3, 80px); }
        
        .cell.fixed { font-weight: bold; color: var(--ink); cursor: default; }
        .cell.correct { color: var(--success); cursor: default; }
        .cell.wrong { color: var(--error); animation: shake 0.3s; }
        .cell.selected { background-color: var(--highlight); }
        
        @keyframes shake { 0%, 100% {transform:translateX(0);} 25% {transform:translateX(-3px);} 75% {transform:translateX(3px);} }
        @keyframes flashSuccess { 0% {background: var(--paper);} 50% {background: #86efac;} 100% {background: var(--paper);} }

        .save-flash { animation: flashSuccess 1s ease; }

        .controls { margin-top: 20px; width: 100%; max-width: 405px; }
        .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        
        button {
            font-family: 'Indie Flower', cursive; background: transparent;
            border: 2px solid var(--ink); font-size: 1.5rem;
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            cursor: pointer; padding: 5px; transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .action-btn { width: 100%; margin-top: 15px; background: var(--ink); color: var(--paper); border-radius: 5px; }
        .auth-input { width: 80%; padding: 10px; margin: 10px 0; font-family: inherit; font-size: 1.2rem; border: 2px solid var(--ink); background: transparent; }
        
        @media (max-width: 500px) {
            .grid-9 { grid-template-columns: repeat(9, 34px); grid-template-rows: repeat(9, 34px); }
            .grid-6 { grid-template-columns: repeat(6, 45px); grid-template-rows: repeat(6, 45px); }
            .cell { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <svg style="display: none;">
        <filter id="handdrawn">
            <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="3" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" />
        </filter>
    </svg>

    <div id="auth-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>Login to Play</h2>
            <input type="email" id="email" class="auth-input" placeholder="Enter Email">
            <input type="password" id="password" class="auth-input" placeholder="Password">
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button onclick="handleAuth('signup')" style="flex:1;">Sign Up</button>
                <button onclick="handleAuth('login')" style="flex:1; background:var(--ink); color:white;">Login</button>
            </div>
            <p id="auth-msg" style="margin-top:10px; font-size:0.9rem;"></p>
        </div>
    </div>

    <div id="rules-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>📜 Instructions</h2>
            <ul style="text-align:left; font-size:1.1rem; margin: 20px 0;">
                <li><strong>Correct Move:</strong> <span style="color:var(--success)">+5 Points</span></li>
                <li><strong>Wrong Move:</strong> <span style="color:var(--error)">-3 Points</span></li>
                <li>Score accumulates across games!</li>
            </ul>
            <button onclick="closeRules()" style="width:100%; background:var(--ink); color:white;">Start</button>
        </div>
    </div>

    <div id="leaderboard-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>🏆 Top Players</h2>
            <div id="leaderboard-content">Loading...</div>
            <button onclick="document.getElementById('leaderboard-modal').classList.add('hidden')" style="margin-top:20px;">Close</button>
        </div>
    </div>

    <h1>Sudoku</h1>

    <div class="top-bar">
        <span id="user-display">Guest</span>
        <div>
            <button class="mode-btn btn-leaderboard" onclick="showLeaderboard()">🏆 Rank</button>
            <button onclick="handleLogout()" style="font-size:1rem; padding:2px 10px;">Logout</button>
        </div>
    </div>

    <div class="mode-selector">
        <button class="mode-btn" onclick="setMode(3)">3x3</button>
        <button class="mode-btn" onclick="setMode(6)">6x6</button>
        <button class="mode-btn active" onclick="setMode(9)">9x9</button>
    </div>

    <div class="top-bar">
        <span>Round Score: <span id="score" style="color:var(--blue-ink)">0</span></span>
        <span>Time: <span id="timer">00:00</span></span>
    </div>

    <div class="game-wrapper" id="game-card">
        <div id="board" class="grid-9"></div>
        <div class="controls">
            <div class="keypad" id="keypad"></div>
            <button class="action-btn" onclick="newGame()">Reset Board</button>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SUPABASE_URL = 'https://fjroiowramtbnaubocvv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqcm9pb3dyYW10Ym5hdWJvY3Z2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1MjY4OTIsImV4cCI6MjA4NTEwMjg5Mn0.GVsIQmiGKpnVZXzFvzu7op3wCCXwbtUIeK1wyxzon-w';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- STATE ---
        let currentSize = 9;
        let solutionBoard = [], playerBoard = [];
        let currentRoundScore = 0;
        let gameActive = false, timerInterval, secondsElapsed = 0;
        let selectedCell = null;

        // --- AUTH ---
        async function handleAuth(type) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('auth-msg');
            msg.innerText = "Processing...";
            try {
                let { error } = type === 'signup' 
                    ? await supabaseClient.auth.signUp({ email, password })
                    : await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                if (type === 'signup') {
                    msg.innerText = "Success! Check email."; msg.style.color = "var(--success)";
                } else {
                    document.getElementById('auth-modal').classList.add('hidden');
                    document.getElementById('rules-modal').classList.remove('hidden');
                    checkUser();
                }
            } catch (err) { msg.innerText = err.message; msg.style.color = "var(--error)"; }
        }

        async function checkUser() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                document.getElementById('auth-modal').classList.add('hidden');
                document.getElementById('user-display').innerText = user.email.split('@')[0];
                if (document.getElementById('rules-modal').classList.contains('hidden') && !gameActive) newGame();
            } else {
                document.getElementById('auth-modal').classList.remove('hidden');
            }
        }

        async function handleLogout() { await supabaseClient.auth.signOut(); location.reload(); }
        function closeRules() { document.getElementById('rules-modal').classList.add('hidden'); newGame(); }

        // --- LEADERBOARD ---
        async function showLeaderboard() {
            const modal = document.getElementById('leaderboard-modal');
            const content = document.getElementById('leaderboard-content');
            modal.classList.remove('hidden');
            content.innerHTML = "Fetching scores...";

            const { data, error } = await supabaseClient
                .from('game_scores')
                .select('username, score')
                .order('score', { ascending: false })
                .limit(10);

            if (error) return content.innerText = "Error loading scores";

            let html = `<table><thead><tr><th>#</th><th>Player</th><th>Total Score</th></tr></thead><tbody>`;
            data.forEach((row, index) => {
                html += `<tr><td>${index + 1}</td><td>${row.username || 'Anon'}</td><td>${row.score}</td></tr>`;
            });
            html += `</tbody></table>`;
            content.innerHTML = html;
        }

        // --- ENGINE ---
        function setMode(size) {
            currentSize = size;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            // Visual toggle
            if(size === 3) document.querySelectorAll('.mode-btn')[1].classList.add('active');
            else if(size === 6) document.querySelectorAll('.mode-btn')[2].classList.add('active');
            else document.querySelectorAll('.mode-btn')[3].classList.add('active');
            document.getElementById('board').className = `grid-${size}`;
            newGame();
        }

        function newGame() {
            currentRoundScore = 0;
            updateScoreDisplay();
            gameActive = true; secondsElapsed = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                let m = Math.floor(secondsElapsed/60).toString().padStart(2,'0');
                let s = (secondsElapsed%60).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);

            drawKeypad();
            const puzzle = generatePuzzle(currentSize);
            playerBoard = JSON.parse(JSON.stringify(puzzle));
            drawBoard(puzzle);
        }

        function drawKeypad() {
            const k = document.getElementById('keypad'); k.innerHTML = '';
            k.style.gridTemplateColumns = `repeat(${Math.min(currentSize, 5)}, 1fr)`;
            for(let i=1; i<=currentSize; i++) {
                let b = document.createElement('button'); b.innerText = i;
                b.onclick = () => inputNumber(i); k.appendChild(b);
            }
            let d = document.createElement('button'); d.innerText = '⌫';
            d.style.color = 'var(--error)'; d.onclick = () => inputNumber(0); k.appendChild(d);
        }

        function generatePuzzle(size) {
            let b = Array.from({length: size}, () => Array(size).fill(0));
            if(size===9) { fillBox(b,0,0,3,3); fillBox(b,3,3,3,3); fillBox(b,6,6,3,3); }
            else if(size===6) { fillBox(b,0,0,2,3); fillBox(b,2,3,2,3); }
            solveHelper(b, size);
            solutionBoard = JSON.parse(JSON.stringify(b));
            let attempts = size===9?40:(size===6?15:4);
            while(attempts>0) {
                let r = Math.floor(Math.random()*size); let c = Math.floor(Math.random()*size);
                if(b[r][c]!==0) { b[r][c]=0; attempts--; }
            }
            return b;
        }

        function fillBox(b, sr, sc, r, c) {
            let n = shuffle(Array.from({length:currentSize},(_,i)=>i+1));
            let idx=0; for(let i=0; i<r; i++) for(let j=0; j<c; j++) if(idx<n.length) b[sr+i][sc+j]=n[idx++];
        }
        function shuffle(a) { return a.sort(()=>Math.random()-0.5); }
        function solveHelper(b, size) {
            for(let r=0; r<size; r++) for(let c=0; c<size; c++) if(b[r][c]===0) {
                let ns = shuffle(Array.from({length:size},(_,i)=>i+1));
                for(let n of ns) if(isValid(b,r,c,n,size)) {
                    b[r][c]=n; if(solveHelper(b,size)) return true; b[r][c]=0;
                }
                return false;
            }
            return true;
        }
        function isValid(b,r,c,n,size) {
            for(let i=0; i<size; i++) if(b[r][i]===n || b[i][c]===n) return false;
            if(size===9) {
                let br=Math.floor(r/3)*3, bc=Math.floor(c/3)*3;
                for(let i=0; i<3; i++) for(let j=0; j<3; j++) if(b[br+i][bc+j]===n) return false;
            } else if(size===6) {
                let br=Math.floor(r/2)*2, bc=Math.floor(c/3)*3;
                for(let i=0; i<2; i++) for(let j=0; j<3; j++) if(b[br+i][bc+j]===n) return false;
            }
            return true;
        }

        function drawBoard(b) {
            const el = document.getElementById('board'); el.innerHTML='';
            for(let r=0; r<currentSize; r++) for(let c=0; c<currentSize; c++) {
                let div = document.createElement('div'); div.className='cell';
                div.dataset.r=r; div.dataset.c=c;
                if(b[r][c]!==0) { div.innerText=b[r][c]; div.classList.add('fixed'); }
                else div.onclick = ()=>selectCell(div);
                el.appendChild(div);
            }
        }
        function selectCell(c) {
            if(!gameActive || c.classList.contains('fixed') || c.classList.contains('correct')) return;
            if(selectedCell) selectedCell.classList.remove('selected');
            selectedCell = c; c.classList.add('selected');
        }
        function inputNumber(n) {
            if(!selectedCell || !gameActive) return;
            const r = parseInt(selectedCell.dataset.r), c = parseInt(selectedCell.dataset.c);
            if(n===0) { selectedCell.innerText=''; selectedCell.classList.remove('wrong'); playerBoard[r][c]=0; return; }
            const correct = solutionBoard[r][c]; selectedCell.innerText = n;
            if(n===correct) {
                selectedCell.className='cell correct'; currentRoundScore += 5; playerBoard[r][c]=n; selectedCell=null; checkWin();
            } else { selectedCell.classList.add('wrong'); currentRoundScore -= 3; }
            updateScoreDisplay();
        }
        function updateScoreDisplay() {
            const el = document.getElementById('score'); el.innerText = currentRoundScore;
            el.style.color = currentRoundScore<0?'var(--error)':'var(--blue-ink)';
        }

        // --- CUMULATIVE SCORE SAVE ---
        async function checkWin() {
            let filled = 0;
            for(let r=0; r<currentSize; r++) for(let c=0; c<currentSize; c++) if(playerBoard[r][c]===solutionBoard[r][c]) filled++;

            if (filled === currentSize * currentSize) {
                gameActive = false; clearInterval(timerInterval);
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) return alert("Not logged in!");

                // 1. Get Old Score
                let { data: rows, error } = await supabaseClient.from('game_scores').select('score').eq('user_id', user.id);
                
                let oldScore = (rows && rows.length > 0) ? rows[0].score : 0;
                let newTotal = oldScore + currentRoundScore;

                // 2. UPSERT (Insert or Update)
                const { error: upsertError } = await supabaseClient
                    .from('game_scores')
                    .upsert({ 
                        user_id: user.id, 
                        score: newTotal, 
                        time_taken: secondsElapsed,
                        username: user.email.split('@')[0]
                    });

                if (upsertError) {
                    console.error(upsertError);
                    alert("Error saving score: " + upsertError.message);
                } else {
                    document.getElementById('game-card').classList.add('save-flash');
                    setTimeout(() => document.getElementById('game-card').classList.remove('save-flash'), 1000);
                    alert(`Round Won!\nPrevious Total: ${oldScore}\nRound Score: ${currentRoundScore}\nNew Total: ${newTotal}`);
                    showLeaderboard();
                }
            }
        }

        checkUser();
    </script>
</body>

</html>
